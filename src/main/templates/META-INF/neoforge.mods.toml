modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
# custom third-person arm poses (HumanoidModel.ArmPose) for weapon stances and swings
enumExtensions = "META-INF/enumextensions.json"

# keeps the server from hanging on shutdown while chunks are still loading (see ChunkMapMixin)
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"

# optional: with Better Combat installed the melee weapons use its combat (weapon_attributes data, compat/bettercombat)
[[dependencies.${mod_id}]]
modId = "bettercombat"
type = "optional"
versionRange = "[2.4,)"
ordering = "AFTER"
side = "BOTH"

# optional: with Punchy installed this mod's items are put on its item blacklist, so they keep their own first-person
# animations (compat/punchy); any version
[[dependencies.${mod_id}]]
modId = "punchy"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
