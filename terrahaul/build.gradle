plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // visual test (see com.terrahaul.client.dev.ClientScreenshotTest):
            //   -Pquickplay=<world> -Pscreenshots="name@find:waterfall,60,25;..."
            if (project.hasProperty('quickplay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickplay').toString())
            }
            if (project.hasProperty('screenshots')) {
                systemProperty 'terrahaul.screenshots', project.property('screenshots').toString()
            }
            // -Pmultiplayer=host:port: join a server, wait, screenshot and disconnect (network test)
            if (project.hasProperty('multiplayer')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('multiplayer').toString())
                systemProperty 'terrahaul.screenshots.join', 'true'
            }
            // -PmemoryLog: log heap, process memory and renderer statistics every 10 s
            if (project.hasProperty('memoryLog')) {
                systemProperty 'terrahaul.screenshots.memory', 'true'
                systemProperty 'terrahaul.screenshots.memoryInterval', project.property('memoryLog').toString().isEmpty() ? '200' : project.property('memoryLog').toString()
            }
            if (project.hasProperty('vanillaFog')) {
                systemProperty 'terrahaul.debug.vanillaFog', 'true'
            }
            // -PcreateWorldCheck: open the Create World screen, log the selected world type, screenshot it
            if (project.hasProperty('createWorldCheck')) {
                systemProperty 'terrahaul.screenshots.createWorld', 'true'
            }
            // (-PmcXmx=<size> lowers the heap where other games share the machine's memory)
            jvmArguments.addAll("-Xmx${project.findProperty('mcXmx') ?: '6G'}".toString())
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // automated validation (see com.terrahaul.dev.AutoTest): -Pautotest=<dir> [-Pareas="x,z,r;..."]
            if (project.hasProperty('autotest')) {
                systemProperty 'terrahaul.autotest', project.property('autotest').toString()
                systemProperty 'terrahaul.autotest.areas', (project.findProperty('areas') ?: '0,0,6').toString()
                if (project.hasProperty('probe')) {
                    systemProperty 'terrahaul.autotest.probe', project.property('probe').toString()
                }
                if (project.hasProperty('debugProps')) {
                    project.property('debugProps').toString().split(',').each { systemProperty it, 'true' }
                }
                if (project.hasProperty('heightAt')) {
                    systemProperty 'terrahaul.autotest.heightAt', project.property('heightAt').toString()
                }
                if (project.hasProperty('biomeFeatures')) {
                    systemProperty 'terrahaul.autotest.biomeFeatures', project.property('biomeFeatures').toString()
                }
                if (project.hasProperty('noStructures')) {
                    systemProperty 'terrahaul.autotest.structures', 'false'
                }
            }
            jvmArguments.addAll("-Xmx${project.findProperty('mcXmx') ?: '6G'}".toString())
            if (project.hasProperty('jfr')) {
                jvmArguments.add("-XX:StartFlightRecording=filename=${project.property('jfr')},settings=profile")
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------------------------
// Development tools (not part of the mod jar): offline terrain map renderer used to tune the
// terrain model without launching Minecraft. Run with:
//   ./gradlew renderMap -Pargs="<seed> <centerX> <centerZ> <sizeBlocks> <blocksPerPixel> <out.png> [mode]"
// ---------------------------------------------------------------------------------------------
// The terrain model and the feature plans are pure Java; the devtools also see Minecraft (its noise
// classes and the vanilla data), so they can derive a world's terrain model from its world seed as
// the game does and evaluate the noise router's caves (see GameWorld and RouterTerrain).
sourceSets {
    devtools {
        java.srcDir 'src/devtools/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('renderMap', JavaExec) {
    group = 'terrahaul'
    description = 'Renders the Terrahaul terrain model to a PNG map (development only).'
    classpath = sourceSets.devtools.runtimeClasspath
    mainClass = 'com.terrahaul.devtools.MapRenderer'
    jvmArgs '-Xmx4G', '-Djava.awt.headless=true', "-DcamHeight=${project.findProperty('camHeight') ?: '180'}"
    args = (project.findProperty('args') ?: '12345 0 0 16384 16 build/map.png').toString().split(' ').toList()
}

