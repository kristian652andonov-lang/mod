// terrain audits (development only): sheer walls and slots per landform, finder target checks,
// floating fragments of the 3D terrain density, a line transect, a perspective snapshot,
// wetland statistics of the model and the shape of its mountains (slopes, ledges, crests), and how
// rounded the mountains are at random mountain places (domed summits and shoulders, smooth faces)
['wallAudit': 'WallAudit', 'finderAudit': 'FinderAudit', 'fragmentAudit': 'FragmentAudit', 'transect': 'Transect', 'snapshot': 'Snapshot', 'wetlandStats': 'WetlandStats',
 'mountainShapeStats': 'MountainShapeStats', 'domeSurvey': 'DomeSurvey'].each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'terrahaul'
        classpath = sourceSets.devtools.runtimeClasspath
        mainClass = "com.terrahaul.devtools.${cls}"
        jvmArgs '-Xmx5G', '-Djava.awt.headless=true'
        args = (project.findProperty('args') ?: '').toString().split(' ').findAll { !it.isEmpty() }.toList()
    }
}
