plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    // Better Combat (optional compatibility) and the libraries it needs in a dev client
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content {
            includeGroup 'dev.kosmx.player-anim'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Dev-only: a Java Flight Recording of the run (CPU samples): -PfwJfr=/path/to/file.jfr
            if (project.hasProperty('fwJfr')) {
                jvmArgument '-XX:StartFlightRecording=filename=' + project.property('fwJfr') + ',settings=profile,dumponexit=true'
            }
            // Dev-only: the game's memory, as a launcher would set it: -PfwXmx=2G
            if (project.hasProperty('fwXmx')) {
                jvmArgument '-Xmx' + project.property('fwXmx')
            }
            // Dev-only scripted screenshot run: ./gradlew runClient -PfwDevtest=voidfang
            if (project.hasProperty('fwDevtest')) {
                systemProperty 'fantasyweapons.devtest', project.property('fwDevtest')
                if (project.hasProperty('fwServer')) {
                    // a dedicated server instead (./gradlew runWgtest in another shell): -PfwServer=localhost
                    programArguments.addAll '--quickPlayMultiplayer', project.property('fwServer') + ':25565', '--width', '1280', '--height', '720', '--username', 'Tester'
                } else {
                    programArguments.addAll '--quickPlaySingleplayer', (project.findProperty('fwWorld') ?: 'fwtest'), '--width', '1280', '--height', '720', '--username', 'Tester'
                }
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Headless server that runs every @GameTest in this mod, then exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Dev-only: a dedicated server on a fresh normal world (run-wgtest/) that runs a command script and stops:
        // ./gradlew runWgtest -PfwServerScript=/path/to/commands.txt
        wgtest {
            server()
            gameDirectory = project.file('run-wgtest')
            programArgument '--nogui'
            if (project.hasProperty('fwServerScript')) {
                systemProperty 'fantasyweapons.serverscript', project.property('fwServerScript')
            }
        }
        // Data generation (loot tables, recipes, tags, models, world gen): ./gradlew runData
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Better Combat is optional: compiled against, never bundled or required (see compat/bettercombat)
    compileOnly("maven.modrinth:better-combat:${bettercombat_version}") { transitive = false }
    compileOnly("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}") { transitive = false }
    // Dev only: ./gradlew runClient -PwithBetterCombat runs the game with Better Combat and its libraries installed
    if (project.hasProperty('withBetterCombat')) {
        runtimeOnly("maven.modrinth:better-combat:${bettercombat_version}") { transitive = false }
        runtimeOnly("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}") { transitive = false }
        runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            geckolib_version       : geckolib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
// generated by runData, committed to the repository
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
